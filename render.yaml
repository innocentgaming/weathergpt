services:
  # 1. FastAPI Backend Web Service (Free Tier Native Python)
  - type: web
    name: weathergpt-backendnew
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PORT
        value: 8000
      - key: DEMO_MODE
        value: "True"
      - key: DATABASE_URL
        value: sqlite:///./weathergpt.db
      - key: GEMINI_API_KEY
        sync: false # Set in Render Dashboard
      - key: OPENWEATHER_API_KEY
        sync: false # Set in Render Dashboard

  # 2. Next.js Frontend Web Service (Free Tier Native Node.js)
  - type: web
    name: weathergpt-frontendnew
    runtime: node
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: PORT
        value: 3000
      - key: NEXT_PUBLIC_API_URL
        value: https://weathergpt-backendnew.onrender.com
