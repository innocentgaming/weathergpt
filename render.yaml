services:
  # 1. FastAPI Backend Web Service
  - type: web
    name: weathergpt-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    envVars:
      - key: PORT
        value: 8000
      - key: DEMO_MODE
        value: "True"
      - key: DATABASE_URL
        value: sqlite:///./weathergpt.db
      - key: GEMINI_API_KEY
        sync: false # Set in Render Dashboard
      - key: OPENWEATHER_API_KEY
        sync: false # Set in Render Dashboard

  # 2. Next.js Frontend Web Service
  - type: web
    name: weathergpt-frontend
    runtime: docker
    dockerfilePath: frontend/Dockerfile
    dockerContext: frontend
    envVars:
      - key: PORT
        value: 3000
      - key: NEXT_PUBLIC_API_URL
        value: https://weathergpt-backendnew.onrender.com # Deployed backend URL
