services:
  # 1. FastAPI Backend Web Service
  - type: web
    name: weathergpt-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: .
    envVars:
      - key: PORT
        value: 8000
      - key: DEMO_MODE
        value: "True"
      - key: DATABASE_URL
        fromDatabase:
          name: weathergpt-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false # Set in Render Dashboard
      - key: OPENWEATHER_API_KEY
        sync: false # Set in Render Dashboard

  # 2. Next.js Frontend Web Service
  - type: web
    name: weathergpt-frontend
    runtime: docker
    dockerfilePath: frontend/Dockerfile
    dockerContext: frontend
    envVars:
      - key: PORT
        value: 3000
      - key: NEXT_PUBLIC_API_URL
        value: https://weathergpt-backend.onrender.com # Replace with your backend's actual Render URL if service name differs

databases:
  - name: weathergpt-db
    plan: free # Render's free PostgreSQL tier (expires after 90 days, upgrade for production)
